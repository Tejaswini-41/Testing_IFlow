name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'CPI Mapping Endpoint'
        required: true

      target_file_name:
        description: 'Current response file name (stored under results/)'
        required: true   

      token:
        description: 'OAuth token from UI'
        required: true

      request_headers:
        description: 'Request headers JSON from UI (key:value object)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages

    steps:
      # -------------------- 📥 Checkout --------------------
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # -------------------- 🐍 Install Dependencies --------------------

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          pip install --upgrade pip
          pip install requests deepdiff plotly

      - name: Create folders
        run: mkdir -p results

      # -------------------- ⚙️ Core Logic --------------------
      - name: Execute CPI iFlow Logic
        id: cpi_logic
        run: |
          python3 - <<'PYEOF'
          import os, json, sys
          import requests
          from pathlib import Path

          # Read inputs
          url = "${{ github.event.inputs.iflow_url }}"
          token = "${{ github.event.inputs.token }}"
          headers_json_str = r'''${{ github.event.inputs.request_headers }}'''
          target_file = "${{ github.event.inputs.target_file_name }}"
          
          payload_file = Path("Payload.json")
          base_file = Path("results/response_base.txt")
          current_file = Path(f"results/{target_file}")
          
          headers_base = Path("results/request_headers_base.txt")
          headers_current = Path("results/request_headers_current.txt")
          
          print("🚀 Starting CPI iFlow Execution Logic...")
          print(f"URL: {url}")
          print(f"Token: {'*' * min(8, len(token))}...")
          print(f"Headers JSON string: {headers_json_str[:100]}...")
          
          # Parse headers
          try:
              headers_dict = json.loads(headers_json_str) if headers_json_str.strip() else {}
              print(f"✅ Parsed headers: {list(headers_dict.keys())}")
          except json.JSONDecodeError as e:
              print(f"❌ Failed to parse headers JSON: {e}")
              print(f"Raw headers input: {headers_json_str}")
              headers_dict = {}
          
          # Build final headers
          headers_dict["Authorization"] = f"Bearer {token}"
          if "Content-Type" not in headers_dict:
              headers_dict["Content-Type"] = "application/json"
          
          print(f"Final headers to send: {list(headers_dict.keys())}")
          
          # Load payload
          if payload_file.exists():
              try:
                  payload = json.loads(payload_file.read_text(encoding="utf-8"))
                  print(f"✅ Loaded payload from {payload_file}")
              except Exception as e:
                  print(f"⚠️ Failed to parse payload, using empty object: {e}")
                  payload = {}
          else:
              print(f"⚠️ Payload file not found, using empty object")
              payload = {}
          
          # First run check
          if not base_file.exists():
              print("🟢 First run: No base file found.")
              try:
                  resp = requests.post(url, json=payload, headers=headers_dict, timeout=60)
                  print(f"Response status: {resp.status_code}")
                  print(f"Response headers: {dict(resp.headers)}")
                  
                  if resp.status_code >= 400:
                      print(f"❌ API returned error status {resp.status_code}")
                      print(f"Response body: {resp.text[:500]}")
                      sys.exit(1)
                  
                  base_file.parent.mkdir(parents=True, exist_ok=True)
                  base_file.write_text(resp.text, encoding="utf-8")
                  headers_base.write_text(json.dumps(headers_dict, indent=2), encoding="utf-8")
                  
                  print(f"✅ Base response saved to {base_file}")
                  print("first_run=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
                  sys.exit(0)
              except requests.exceptions.RequestException as e:
                  print(f"❌ Request failed: {e}")
                  sys.exit(1)
          
          # Subsequent runs
          print("🟠 Base file exists: Running comparison.")
          try:
              resp = requests.post(url, json=payload, headers=headers_dict, timeout=60)
              print(f"Response status: {resp.status_code}")
              
              if resp.status_code >= 400:
                  print(f"❌ API returned error status {resp.status_code}")
                  print(f"Response body: {resp.text[:500]}")
                  sys.exit(1)
              
              current_file.parent.mkdir(parents=True, exist_ok=True)
              current_file.write_text(resp.text, encoding="utf-8")
              headers_current.write_text(json.dumps(headers_dict, indent=2), encoding="utf-8")
              
              print(f"✅ Current response saved to {current_file}")
              print("first_run=false", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          except requests.exceptions.RequestException as e:
              print(f"❌ Request failed: {e}")
              sys.exit(1)
          PYEOF

      # -------------------- COMPARISON --------------------
      - name: Compare Base and Actual Responses + Headers
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          echo "🔍 Comparing Base and Actual Responses AND Request Headers..."
          python3 - <<'EOF'
          import json, difflib
          from deepdiff import DeepDiff

          # -------------------- Files --------------------
          base_path = "results/response_base.txt"
          current_path = "results/${{ github.event.inputs.target_file_name }}"
          diff_path = "results/diff.txt"

          headers_base_path = "results/request_headers_base.txt"
          headers_current_path = "results/request_headers_current.txt"
          headers_diff_path = "results/diff_headers.txt"

          # -------------------- JSON Compare --------------------

          def compare_json(base_path, current_path, out_path):
              try:
                  with open(base_path) as f1, open(current_path) as f2:
                      base_data = json.load(f1)
                      current_data = json.load(f2)

                  diff = DeepDiff(base_data, current_data, ignore_order=True, verbose_level=2)

                  with open(out_path, 'w', encoding='utf-8') as f:
                      f.write(json.dumps(diff, indent=2, ensure_ascii=False))

                  print(f"✅ JSON diff saved to {out_path}")
              except Exception as e:
                  print(f"⚠️ JSON diff failed (fallback to text): {e}")
                  compare_text(base_path, current_path, out_path)

          # -------------------- Text Compare (fallback) --------------------
          def compare_text(base_path, current_path, out_path):
              with open(base_path) as f1, open(current_path) as f2:
                  base_lines = f1.readlines()
                  current_lines = f2.readlines()

              diff = list(difflib.unified_diff(
                  base_lines, current_lines,
                  fromfile=base_path,
                  tofile=current_path,
                  lineterm=""
              ))

              with open(out_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(diff))

              print(f"✅ Text diff saved to {out_path}")

          # -------------------- Compare Response Body --------------------
          try:
              with open(base_path) as f: json.load(f)
              with open(current_path) as f: json.load(f)
              compare_json(base_path, current_path, diff_path)
          except Exception:
              compare_text(base_path, current_path, diff_path)

          # -------------------- Compare Request Headers --------------------
          try:
              with open(headers_base_path) as f: base_h = json.load(f)
              with open(headers_current_path) as f: current_h = json.load(f)

              headers_diff = DeepDiff(base_h, current_h, ignore_order=True, verbose_level=2)

              with open(headers_diff_path, 'w', encoding='utf-8') as f:
                  f.write(json.dumps(headers_diff, indent=2, ensure_ascii=False))

              print(f"✅ Request headers diff saved to {headers_diff_path}")

          except Exception as e:
              print(f"⚠️ Header JSON diff failed, using text: {e}")
              compare_text(headers_base_path, headers_current_path, headers_diff_path)

          EOF

          echo "✅ Response and header diffs generated: results/diff.txt & results/diff_headers.txt"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          python3 dashboard.py results/diff.txt 

      # -------------------- 🧾 Commit & Upload --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Setup GitHub Pages --------------------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/

      # -------------------- 💾 Upload Report Artifact --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"  
          URL="$BASE_URL/diff_dashboard.html"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 Dashboard deployed successfully!"

      # -------------------- 📦 Upload Local Artifact --------------------
      - name: Upload Diff Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPI_Diff_Report
          path: results/
          retention-days: 1
