name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'CPI Mapping Endpoint'
        required: true


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages

    steps:
      # -------------------- 📥 Checkout --------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # -------------------- 🐍 Setup Environment --------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          pip install --upgrade pip
          pip install requests deepdiff

      - name: Create folders
        run: mkdir -p results upload

      # -------------------- ⚙️ Core Logic --------------------
      - name: CPI iFlow Execution Logic
        id: cpi_logic
        run: |
          echo "🚀 Starting CPI iFlow Execution Logic..."
          URL="${{ github.event.inputs.iflow_url }}"
          PAYLOAD_FILE="Payload.json"
          BASE_FILE="results/response_base"
          CURRENT_FILE="results/response_actual.txt"

          # ---- Case 1: First Run (No Base Exists) ----
          if [ ! -f "$BASE_FILE" ]; then
            echo "🟢 No base compare file found. First run detected."
            if [ -f "$PAYLOAD_FILE" ]; then
              echo "✅ Using payload from $PAYLOAD_FILE"
              curl -s -X POST "$URL" \
                -H "Content-Type: application/json" \
                --data-binary "@$PAYLOAD_FILE" \
                -o "results/$BASE_FILE"
            else
              echo "⚠️ No payload found, sending empty JSON."
              echo '{}' > temp_payload.json
              curl -s -X POST "$URL" \
                -H "Content-Type: application/json" \
                --data-binary "@temp_payload.json" \
                -o "results/$BASE_FILE"
            fi
            echo "✅ Base response saved as $BASE_FILE"
            echo "first_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---- Case 2: Subsequent Run (Base Exists) ----
          echo "🟠 Base compare file found. Proceeding with comparison run."
          if [ -f "$PAYLOAD_FILE" ]; then
            echo "✅ Using payload from upload/$PAYLOAD_FILE"
            curl -s -X POST "$URL" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD_FILE" \
              -o "results/$CURRENT_FILE"
          else
            echo "⚠️ No payload found, sending empty JSON."
            echo '{}' > temp_payload.json
            curl -s -X POST "$URL" \
              -H "Content-Type: application/json" \
              --data-binary "@temp_payload.json" \
              -o "results/$CURRENT_FILE"
          fi
          echo "✅ Current response saved as $CURRENT_FILE"
          echo "first_run=false" >> $GITHUB_OUTPUT

      # -------------------- 🧩 Compare Only If Not First Run --------------------
      - name: Compare Base and Actual Responses
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          echo "🔍 Comparing Base and Actual Responses..."
          python3 - <<'PY'
          import json, difflib
          from deepdiff import DeepDiff

          base = "results/response_base.txt"
          current = "results/response_actual.txt"
          diff_output = "results/diff.txt"

          python3 - <<'EOF'
          import os, json, difflib
          from deepdiff import DeepDiff

          def compare_json(base_path, current_path, out_path):
              try:
                  with open(base_path) as f1, open(current_path) as f2:
                      base_data = json.load(f1)
                      current_data = json.load(f2)
                  diff = DeepDiff(base_data, current_data, ignore_order=True, verbose_level=2)
                  with open(out_path, 'w', encoding='utf-8') as f:
                      f.write(json.dumps(diff, indent=2, ensure_ascii=False))
                  print(f"✅ JSON diff saved to {out_path}")
              except Exception as e:
                  print(f"⚠️ JSON diff failed, falling back to text: {e}")
                  compare_text(base_path, current_path, out_path)

          def compare_text(base_path, current_path, out_path):
              with open(base_path) as f1, open(current_path) as f2:
                  base_lines, current_lines = f1.readlines(), f2.readlines()
              diff = list(difflib.unified_diff(
                  base_lines, current_lines,
                  fromfile=base_path,
                  tofile=current_path,
                  lineterm=""
              ))
              with open(out_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(diff))
              print(f"✅ Text diff (with +/-) saved to {out_path}")

          # --- Compare Headers ---
          compare_text("results/headers_base.txt", "results/headers_current.txt", "results/diff_headers.txt")

          # --- Compare Response Body ---
          base_body = "results/response_base.txt"
          current_body = "results/response_current.txt"

          try:
              with open(base_body) as f:
                  json.load(f)
              with open(current_body) as f:
                  json.load(f)
              compare_json(base_body, current_body, "results/diff.txt")
          except Exception:
              compare_text(base_body, current_body, "results/diff.txt")
          EOF

          echo "✅ Generated:"
          echo " - results/diff.txt (Response body diff)"
          echo " - results/diff_headers.txt (Headers diff)"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        run: |
          python3 dashboard.py results/diff.txt

      # -------------------- 🧾 Commit Results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Upload & Deploy Dashboard --------------------
      
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"  
          URL="$BASE_URL/diff_dashboard.html"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 All done!"