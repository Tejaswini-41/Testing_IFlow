name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'CPI Mapping Endpoint'
        required: true

      target_file_name:
        description: 'Current response file name (stored under results/)'
        required: true   

      token:
        description: 'OAuth token from UI'
        required: true

      request_headers:
        description: 'Request headers JSON from UI (key:value object)'
        required: true

      http_method:
        description: 'HTTP method to use for the request (GET, POST, PUT, PATCH, DELETE)'
        required: false
        default: 'POST'
        
      auth_type:
        description: 'Authorization type (oauth or basic)'
        required: true
        default: 'oauth'


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages

    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          pip install --upgrade pip
          pip install requests deepdiff plotly xmltodict

      - name: Create folders
        run: mkdir -p results

      # -------------------- ⚙️ Core Logic (dynamic method) --------------------
      - name: Execute CPI iFlow Logic (Dynamic HTTP Method)
        id: cpi_logic
        run: |
          python3 - <<'PYEOF'
          import json, sys, os, base64
          import requests
          from pathlib import Path

          print("🚀 Starting CPI iFlow Execution Logic...")

          # Inputs from workflow_dispatch
          url = "${{ github.event.inputs.iflow_url }}"
          token = "${{ github.event.inputs.token }}"
          headers_input = r'''${{ github.event.inputs.request_headers }}'''
          method = "${{ github.event.inputs.http_method }}".upper() or "POST"
          target_filename = "${{ github.event.inputs.target_file_name }}"
          auth_type = "${{ github.event.inputs.auth_type }}".lower()

          payload_file = Path("Payload.json")
          base_response_file = Path("results/response_base.txt")
          current_response_file = Path(f"results/{target_filename}")
          base_headers_file = Path("results/request_headers_base.txt")
          current_headers_file = Path("results/request_headers_current.txt")

          print(f"\n📌 Requested method: {method}")

          # Parse headers JSON
          try:
              user_headers = json.loads(headers_input) if headers_input.strip() else {}
          except json.JSONDecodeError:
              print("❌ Invalid headers JSON. Using empty headers.")
              user_headers = {}

          # Ensure Content-Type default if not present
          if not any(k.lower() == "content-type" for k in user_headers):
              user_headers["Content-Type"] = "application/json"

          # Add Authorization header from token (frontend supplies token)
          # Add Authorization header based on auth_type
          if auth_type == "basic":
              # token expected as "username:password"
              basic_b64 = base64.b64encode(token.encode("utf-8")).decode("utf-8")
              user_headers["Authorization"] = f"Basic {basic_b64}"
              print("✅ Using Basic Auth")
          else:
              user_headers["Authorization"] = f"Bearer {token}"
              print("✅ Using Bearer (OAuth) Auth")

          print(f"🔹 Final headers keys: {list(user_headers.keys())}")

          # Load payload if present and valid JSON (IGNORED for GET)
          payload = None
          if method != "GET" and payload_file.exists():
              try:
                  payload = json.loads(payload_file.read_text())
                  print("✅ Payload loaded from Payload.json")
              except Exception as e:
                  print("⚠️ Payload.json exists but is not valid JSON. Ignoring payload. Error:", e)
                  payload = None
          else:
              if method == "GET":
                  print("ℹ️ GET method selected – ignoring any existing Payload.json (no request body will be sent).")
              else:
                  print("ℹ️ No Payload.json found in repo (it's optional).")

          # Decide whether method supports a body
          methods_with_body = {"POST", "PUT", "PATCH"}
          send_body = method in methods_with_body

          # Prepare request kwargs
          request_kwargs = {
              "headers": user_headers,
              "timeout": 60
          }
          if send_body and payload is not None:
              request_kwargs["json"] = payload

          # API call wrapper
          def call_cpi():
              try:
                  resp = requests.request(method, url, **request_kwargs)
                  print(f"📥 Response Status: {resp.status_code}")
                  return resp
              except requests.exceptions.RequestException as e:
                  print(f"❌ API call failed: {e}")
                  sys.exit(1)

          # First run (no base saved)
          if not base_response_file.exists():
              print("\n🟢 First Run Detected (no base response file)\n")
              resp = call_cpi()
              if resp.status_code >= 400:
                  print("❌ API returned error:", resp.status_code, resp.text[:500])
                  sys.exit(1)
              base_response_file.parent.mkdir(parents=True, exist_ok=True)
              base_response_file.write_text(resp.text)
              base_headers_file.write_text(json.dumps(user_headers, indent=2))
              print("✅ Base response saved to results/response_base.txt")
              print("first_run=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)

          # Subsequent runs: save current response and continue
          print("\n🟠 Base response exists. Executing request and saving current response...\n")
          resp = call_cpi()
          if resp.status_code >= 400:
              print("❌ API returned error:", resp.status_code, resp.text[:500])
              sys.exit(1)

          current_response_file.parent.mkdir(parents=True, exist_ok=True)
          current_response_file.write_text(resp.text)
          current_headers_file.write_text(json.dumps(user_headers, indent=2))
          print(f"✅ Current response saved to results/{target_filename}")
          print("first_run=false", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PYEOF

      # -------------------- COMPARISON --------------------
      - name: Compare Base and Actual Responses + Headers (JSON & XML)
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          echo "🔍 Comparing Base and Actual Responses (JSON & XML) AND Request Headers..."
          python3 - <<'PYEOF'
          import json, difflib, sys
          from deepdiff import DeepDiff
          import xmltodict
          from pathlib import Path

          base_path = Path("results/response_base.txt")
          current_path = Path("results/${{ github.event.inputs.target_file_name }}")
          diff_text_path = Path("results/diff.txt")
          diff_json_path = Path("results/diff_json.txt")
          diff_xml_path = Path("results/diff_xml.txt")

          headers_base_path = Path("results/request_headers_base.txt")
          headers_current_path = Path("results/request_headers_current.txt")
          headers_diff_path = Path("results/diff_headers.txt")

          def write_text_diff(a_path, b_path, out_path):
              with open(a_path, 'r', encoding='utf-8', errors='ignore') as f1, open(b_path, 'r', encoding='utf-8', errors='ignore') as f2:
                  a_lines = f1.readlines()
                  b_lines = f2.readlines()
              diff = list(difflib.unified_diff(a_lines, b_lines, fromfile=str(a_path), tofile=str(b_path), lineterm=""))
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text("".join(diff), encoding='utf-8', errors='ignore')
              print(f"✅ Text diff saved to {out_path}")

          def try_json_diff(a_path, b_path, out_path):
              try:
                  with open(a_path, 'r', encoding='utf-8') as f:
                      a = json.load(f)
                  with open(b_path, 'r', encoding='utf-8') as f:
                      b = json.load(f)
                  diff = DeepDiff(a, b, ignore_order=True, verbose_level=2)
                  out_path.parent.mkdir(parents=True, exist_ok=True)
                  out_path.write_text(json.dumps(diff, indent=2, ensure_ascii=False), encoding='utf-8')
                  print(f"✅ JSON diff saved to {out_path}")
                  return True
              except Exception as e:
                  print(f"ℹ️ JSON diff attempt failed: {e}")
                  return False

          def try_xml_diff(a_path, b_path, out_path):
              try:
                  with open(a_path, 'r', encoding='utf-8') as f:
                      a_text = f.read()
                  with open(b_path, 'r', encoding='utf-8') as f:
                      b_text = f.read()
                  a_dict = xmltodict.parse(a_text)
                  b_dict = xmltodict.parse(b_text)
                  diff = DeepDiff(a_dict, b_dict, ignore_order=True, verbose_level=2)
                  out_path.parent.mkdir(parents=True, exist_ok=True)
                  out_path.write_text(json.dumps(diff, indent=2, ensure_ascii=False), encoding='utf-8')
                  print(f"✅ XML diff saved to {out_path}")
                  return True
              except Exception as e:
                  print(f"ℹ️ XML diff attempt failed: {e}")
                  return False

          # 1) Try JSON diff (both files JSON)
          json_ok = try_json_diff(base_path, current_path, diff_json_path)

          # 2) Try XML diff (both files XML)
          xml_ok = try_xml_diff(base_path, current_path, diff_xml_path)

          # 3) If neither structured diff worked, fallback to text diff
          if not json_ok and not xml_ok:
              print("⚠️ Neither JSON nor XML parsing succeeded; falling back to text diff.")
              write_text_diff(base_path, current_path, diff_text_path)
          else:
              # also still write a text diff for human-readable line-by-line context (optional)
              write_text_diff(base_path, current_path, diff_text_path)

          # -------------------- Compare Request Headers --------------------
          try:
              with open(headers_base_path, 'r', encoding='utf-8') as f:
                  base_h = json.load(f)
              with open(headers_current_path, 'r', encoding='utf-8') as f:
                  current_h = json.load(f)

              headers_diff = DeepDiff(base_h, current_h, ignore_order=True, verbose_level=2)
              headers_diff_path.parent.mkdir(parents=True, exist_ok=True)
              headers_diff_path.write_text(json.dumps(headers_diff, indent=2, ensure_ascii=False), encoding='utf-8')
              print(f"✅ Request headers diff saved to {headers_diff_path}")

          except Exception as e:
              print(f"⚠️ Header JSON diff failed, using text fallback: {e}")
              write_text_diff(headers_base_path, headers_current_path, headers_diff_path)

          PYEOF

          echo "✅ Response and header diffs generated: results/diff.txt, results/diff_json.txt, results/diff_xml.txt & results/diff_headers.txt"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          python3 dashboard.py results/diff.txt 

      # -------------------- 🧾 Commit & Upload --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Setup GitHub Pages --------------------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/

      # -------------------- 💾 Upload Report Artifact --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"  
          URL="$BASE_URL/diff_dashboard.html"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 Dashboard deployed successfully!"

      # -------------------- 📦 Upload Local Artifact --------------------
      - name: Upload Diff Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPI_Diff_Report
          path: results/
          retention-days: 1
