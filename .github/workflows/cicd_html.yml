name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'CPI Mapping Endpoint'
        required: true

      target_file_name:
        description: 'Current response file name (stored under results/)'
        required: true   

      token:
        description: 'OAuth token from UI'
        required: true

      request_headers:
        description: 'Request headers JSON from UI (key:value object)'
        required: true

      http_method:
        description: 'HTTP method to use for the request (GET, POST, PUT, PATCH, DELETE)'
        required: false
        default: 'POST'
        
      auth_type:
        description: 'Authorization type (oauth or basic)'
        required: true
        default: 'oauth'
      payload_type:
        description: 'Payload type (json or xml)'
        required: false
        default: 'json'
      comparison_mode:
        description: 'Whether to do base/current comparison or just return response'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages

    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          pip install --upgrade pip
          pip install requests deepdiff plotly xmltodict

      - name: Create folders
        run: mkdir -p results

      # ✅ ADD THIS NEW STEP
      - name: Clean up old error responses
        run: |
          if [ -f results/error_response.txt ]; then
            rm results/error_response.txt
            echo "🗑️ Removed old error_response.txt"
          else
            echo "✅ No old error file to clean"
          fi

      # -------------------- ⚙️ Core Logic (dynamic method) --------------------
      - name: Execute CPI iFlow Logic (Dynamic HTTP Method)
        id: cpi_logic
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, sys, os, base64
          import requests
          from pathlib import Path

          print("🚀 Starting CPI iFlow Execution Logic...")

          # Inputs from workflow_dispatch
          url = "${{ github.event.inputs.iflow_url }}"
          token = "${{ github.event.inputs.token }}"
          headers_input = r'''${{ github.event.inputs.request_headers }}'''
          method = "${{ github.event.inputs.http_method }}".upper() or "POST"
          target_filename = "${{ github.event.inputs.target_file_name }}"
          auth_type = "${{ github.event.inputs.auth_type }}".lower()
          payload_type = "${{ github.event.inputs.payload_type }}".lower() or "json"

          payload_file = Path("Payload.xml") if payload_type == "xml" else Path("Payload.json")
          base_response_file = Path("results/response_base.txt")
          current_response_file = Path(f"results/{target_filename}")
          base_headers_file = Path("results/request_headers_base.txt")
          current_headers_file = Path("results/request_headers_current.txt")

          print(f"\n📌 Requested method: {method}")

          # Parse headers JSON
          try:
            user_headers = json.loads(headers_input) if headers_input.strip() else {}
          except json.JSONDecodeError:
            print("❌ Invalid headers JSON. Using empty headers.")
            user_headers = {}

          # Ensure Content-Type default if not present
          if not any(k.lower() == "content-type" for k in user_headers):
            user_headers["Content-Type"] = "application/xml" if payload_type == "xml" else "application/json"

          # Add Authorization header based on auth_type
          if auth_type == "basic":
            # token expected as "username:password"
            basic_b64 = base64.b64encode(token.encode("utf-8")).decode("utf-8")
            user_headers["Authorization"] = f"Basic {basic_b64}"
            print("✅ Using Basic Auth")
          else:
            user_headers["Authorization"] = f"Bearer {token}"
            print("✅ Using Bearer (OAuth) Auth")

          print(f"🔹 Final headers keys: {list(user_headers.keys())}")

          # Load payload if present (IGNORED for GET)
          payload = None
          if method != "GET" and payload_file.exists():
            try:
              if payload_type == "xml":
                payload = payload_file.read_text(encoding="utf-8")
                print("✅ Payload loaded from Payload.xml")
              else:
                payload = json.loads(payload_file.read_text())
                print("✅ Payload loaded from Payload.json")
            except Exception as e:
              print(f"⚠️ {payload_file.name} exists but could not be loaded. Error:", e)
              payload = None
          else:
            if method == "GET":
              print("ℹ️ GET method selected – ignoring any existing payload file (no request body will be sent).")
            else:
              print(f"ℹ️ No {payload_file.name} found in repo (it's optional).")

          # Decide whether method supports a body
          methods_with_body = {"POST", "PUT", "PATCH"}
          send_body = method in methods_with_body

          # Prepare request kwargs
          request_kwargs = {
            "headers": user_headers,
            "timeout": 60
          }
          if send_body and payload is not None:
            if payload_type == "xml":
              request_kwargs["data"] = payload
            else:
              request_kwargs["json"] = payload

          # API call wrapper
          def call_cpi():
            try:
              resp = requests.request(method, url, **request_kwargs)
              print(f"📥 Response Status: {resp.status_code}")
              return resp
            except requests.exceptions.RequestException as e:
              print(f"❌ API call failed: {e}")
              sys.exit(1)
                  
          # ✅ Check if this is simple mode (non-comparison)
          comparison_mode = "${{ github.event.inputs.comparison_mode }}" == "true"

          if not comparison_mode:
              # Simple mode: just execute and save response
              print("\n📋 Simple execution mode (no comparison)\n")
              resp = call_cpi()
              
              if resp.status_code >= 400:
                  # Save error
                  error_file = Path("results/error_response.txt")
                  error_file.parent.mkdir(parents=True, exist_ok=True)
                  error_data = {
                      "status_code": resp.status_code,
                      "error_message": resp.text[:2000] if resp.text else "No response body"
                  }
                  error_file.write_text(json.dumps(error_data, indent=2))
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("api_error=true\n")
                      f.write(f"api_status={resp.status_code}\n")
                  print("⚠️ API error detected. Workflow will continue to commit error response.")
                  sys.exit(0)
              
              # Save successful response
              response_file = Path("results/simple_response.txt")
              response_file.parent.mkdir(parents=True, exist_ok=True)
              response_file.write_text(resp.text)
              
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("simple_mode=true\n")
              
              print("✅ Response saved to results/simple_response.txt")
              sys.exit(0)

          # If we get here, it's comparison mode (existing logic continues)

          # First run (no base saved)
          if not base_response_file.exists():
              print("\n🟢 First Run Detected (no base response file)\n")
              resp = call_cpi()
              if resp.status_code >= 400:
                error_msg = resp.text[:2000] if resp.text else "No response body"

                error_file = Path("results/error_response.txt")
                error_file.parent.mkdir(parents=True, exist_ok=True)

                error_data = {
                    "status_code": resp.status_code,
                    "error_message": error_msg
                }

                error_file.write_text(json.dumps(error_data, indent=2))

                # end info to GitHub Actions (not to console)
                with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                    f.write("api_error=true\n")
                    f.write(f"api_status={resp.status_code}\n")

                print("⚠️ API error detected. Workflow will continue to commit error response.")   
                sys.exit(0)

              base_response_file.parent.mkdir(parents=True, exist_ok=True)
              base_response_file.write_text(resp.text)
              base_headers_file.write_text(json.dumps(user_headers, indent=2))
              print("✅ Base response saved to results/response_base.txt")
              print("first_run=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)

          # Subsequent runs: save current response and continue
          print("\n🟠 Base response exists. Executing request and saving current response...\n")
          resp = call_cpi()
          if resp.status_code >= 400:
              print("❌ API returned error:", resp.status_code, resp.text[:500])
              # Save error response
              error_file = Path("results/error_response.txt")
              error_file.parent.mkdir(parents=True, exist_ok=True)
              error_data = {
                  "status_code": resp.status_code,
                  "timestamp": str(Path("results/error_response.txt").parent),
                  "error_message": resp.text[:2000] if resp.text else "No response body"
              }
              error_file.write_text(json.dumps(error_data, indent=2))
              print("⚠️ Error response saved to results/error_response.txt")
              print("api_error=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              print(f"api_status={resp.status_code}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)


          current_response_file.parent.mkdir(parents=True, exist_ok=True)
          current_response_file.write_text(resp.text)
          current_headers_file.write_text(json.dumps(user_headers, indent=2))
          print(f"✅ Current response saved to results/{target_filename}")
          print("first_run=false", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PYEOF
        
        
      - name: Commit error response if API failed
        if: steps.cpi_logic.outputs.api_error == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/error_response.txt
          git commit -m "API Error Response - Status ${{ steps.cpi_logic.outputs.api_status }} on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No error file to commit"
          git push

      # -------------------- COMPARISON --------------------
      - name: Compare Base and Actual Responses + Headers (auto JSON/XML)
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          echo "🔍 Comparing Base and Actual Responses (auto JSON/XML) AND Request Headers..."
          python3 - <<'PYEOF'
          import json
          import difflib
          from pathlib import Path
          from deepdiff import DeepDiff
          import xmltodict

          # -------------------- Paths --------------------
          base_path = Path("results/response_base.txt")
          current_path = Path("results/${{ github.event.inputs.target_file_name }}")

          diff_path = Path("results/diff.txt")  # single body diff file

          headers_base_path = Path("results/request_headers_base.txt")
          headers_current_path = Path("results/request_headers_current.txt")
          headers_diff_path = Path("results/diff_headers.txt")

          # -------------------- Helpers --------------------
          def write_text_diff(a_path: Path, b_path: Path, out_path: Path):
              with a_path.open('r', encoding='utf-8', errors='ignore') as f1, \
                   b_path.open('r', encoding='utf-8', errors='ignore') as f2:
                  a_lines = f1.readlines()
                  b_lines = f2.readlines()

              diff = list(
                  difflib.unified_diff(
                      a_lines,
                      b_lines,
                      fromfile=str(a_path),
                      tofile=str(b_path),
                      lineterm=""
                  )
              )
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text("".join(diff), encoding='utf-8', errors='ignore')
              print(f"✅ Text diff saved to {out_path}")

          # -------------------- Read bodies --------------------
          base_text = base_path.read_text(encoding='utf-8', errors='ignore')
          current_text = current_path.read_text(encoding='utf-8', errors='ignore')

          base_stripped = base_text.lstrip()
          current_stripped = current_text.lstrip()

          mode = "text"      # default
          base_obj = None
          current_obj = None

          print("ℹ️ First 80 chars of base response:", repr(base_stripped[:80]))
          print("ℹ️ First 80 chars of current response:", repr(current_stripped[:80]))

          # -------------------- Try JSON (based on simple heuristic) --------------------
          try:
              if base_stripped.startswith(('{', '[')) and current_stripped.startswith(('{', '[')):
                  base_obj = json.loads(base_text)
                  current_obj = json.loads(current_text)
                  mode = "json"
                  print("🧩 Detected JSON responses – using JSON comparison.")
              else:
                  print("ℹ️ Bodies do not look like JSON (no leading { or [).")
          except Exception as e:
              print(f"ℹ️ JSON parsing failed, will try XML: {e}")
              mode = "text"
              base_obj = current_obj = None

          # -------------------- If not JSON, try XML (based on simple heuristic) --------------------
          if mode != "json":
              try:
                  if base_stripped.startswith('<') and current_stripped.startswith('<'):
                      base_obj = xmltodict.parse(base_text)
                      current_obj = xmltodict.parse(current_text)
                      mode = "xml"
                      print("📄 Detected XML responses – using XML comparison.")
                  else:
                      print("ℹ️ Bodies do not look like XML (no leading <).")
              except Exception as e:
                  print(f"ℹ️ XML parsing failed, will use text diff: {e}")
                  mode = "text"
                  base_obj = current_obj = None

          # -------------------- Compute diff based on detected mode --------------------
          if mode in ("json", "xml"):
              diff = DeepDiff(base_obj, current_obj, ignore_order=True, verbose_level=2)
              diff_path.parent.mkdir(parents=True, exist_ok=True)
              diff_path.write_text(
                  json.dumps(diff, indent=2, ensure_ascii=False),
                  encoding='utf-8'
              )
              print(f"✅ {mode.upper()} diff saved to {diff_path}")
          else:
              # fallback: pure text diff
              print("⚠️ Neither JSON nor XML reliably detected/parsed; using text diff.")
              write_text_diff(base_path, current_path, diff_path)

          # -------------------- Compare Request Headers (JSON) --------------------
          try:
              with headers_base_path.open('r', encoding='utf-8') as f:
                  base_h = json.load(f)
              with headers_current_path.open('r', encoding='utf-8') as f:
                  current_h = json.load(f)

              headers_diff = DeepDiff(base_h, current_h, ignore_order=True, verbose_level=2)
              headers_diff_path.parent.mkdir(parents=True, exist_ok=True)
              headers_diff_path.write_text(
                  json.dumps(headers_diff, indent=2, ensure_ascii=False),
                  encoding='utf-8'
              )
              print(f"✅ Request headers diff saved to {headers_diff_path}")
          except Exception as e:
              print(f"⚠️ Header JSON diff failed, using text fallback: {e}")
              write_text_diff(headers_base_path, headers_current_path, headers_diff_path)

          PYEOF

          echo "✅ Generated diffs: results/diff.txt (body, JSON/XML-aware) and results/diff_headers.txt"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        if: steps.cpi_logic.outputs.first_run == 'false'
        run: |
          python3 dashboard.py results/diff.txt 

      # -------------------- 🧾 Commit & Upload --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Setup GitHub Pages --------------------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/

      # -------------------- 💾 Deploy to GitHub Pages --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"  
          URL="$BASE_URL/diff_dashboard.html"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 Dashboard deployed successfully!"

      # -------------------- 📦 Upload Local Artifact --------------------
      - name: Upload Diff Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPI_Diff_Report
          path: results/
          retention-days: 1
