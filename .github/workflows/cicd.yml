name: CPI Response Compare (Single Payload, OAuth)

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Payload file name'
        required: false
        default: 'payload.json'
      auth_url:
        description: 'OAuth token URL'
        required: true
      client_id:
        description: 'OAuth Client ID'
        required: true
      client_secret:
        description: 'OAuth Client Secret'
        required: true
      iflow_url_1:
        description: 'CPI iFlow 1 (before mapping change)'
        required: true
        default: 'https://syn-int-suite-ent-qgjsk2hi.it-cpi024-rt.cfapps.eu10-002.hana.ondemand.com/http/ordersimulationtest'
      iflow_url_2:
        description: 'CPI iFlow 2 (after mapping change)'
        required: true
        default: 'https://syn-int-suite-ent-qgjsk2hi.it-cpi024-rt.cfapps.eu10-002.hana.ondemand.com/http/ordersimulationMappingChange'

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq curl
          pip install simplejson

      - name: Create results folder
        run: mkdir -p results

      # -------------------- Step 1: Get OAuth Token --------------------
      - name: Fetch OAuth Token
        id: get_token
        run: |
          echo "🔐 Fetching OAuth token from ${{ github.event.inputs.auth_url }}"
          RESPONSE=$(curl -s -X POST "${{ github.event.inputs.auth_url }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${{ github.event.inputs.client_id }}&client_secret=${{ github.event.inputs.client_secret }}")
          
          echo "Token response: $RESPONSE"
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Failed to fetch access token!"
            exit 1
          fi
          echo "✅ Token acquired successfully"
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      # -------------------- Step 2: Hit CPI iFlow 1 --------------------
      - name: Hit CPI iFlow 1 (Before Mapping Change)
        run: |
          echo "🚀 Hitting iFlow 1: ${{ github.event.inputs.iflow_url_1 }}"
          curl -s -X POST "${{ github.event.inputs.iflow_url_1 }}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/Response_1.txt
          echo "✅ Response 1 saved to results/Response_1.txt"

      # -------------------- Step 3: Hit CPI iFlow 2 --------------------
      - name: Hit CPI iFlow 2 (After Mapping Change)
        run: |
          echo "🚀 Hitting iFlow 2: ${{ github.event.inputs.iflow_url_2 }}"
          curl -s -X POST "${{ github.event.inputs.iflow_url_2 }}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/Response_2.txt
          echo "✅ Response 2 saved to results/Response_2.txt"

      # -------------------- Step 4: Compare Responses --------------------
      - name: Compare Responses (Prettified JSON or Raw)
        run: |
          echo "🔍 Comparing responses..."
          python3 - <<'EOF'
          import json, difflib, os

          path1 = "results/Response_1.txt"
          path2 = "results/Response_2.txt"
          pretty1 = "results/Response_1_pretty.json"
          pretty2 = "results/Response_2_pretty.json"
          diff_file = "results/diff.txt"

          def prettify(src, dest):
              try:
                  with open(src) as f:
                      data = json.loads(f.read())
                  with open(dest, "w") as f:
                      json.dump(data, f, indent=2, sort_keys=True)
                  return True
              except:
                  open(dest, "w").write(open(src).read())
                  return False

          prettify(path1, pretty1)
          prettify(path2, pretty2)

          with open(pretty1) as f1, open(pretty2) as f2:
              base = f1.readlines()
              curr = f2.readlines()

          diff = difflib.unified_diff(base, curr, fromfile="Response_1", tofile="Response_2", lineterm="")
          os.makedirs("results", exist_ok=True)
          with open(diff_file, "w") as f:
              f.writelines(diff)
          print("✅ Diff saved to results/diff.txt")
          EOF

      # -------------------- Step 5: Commit & Push Results --------------------
      - name: Commit & Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A results/
          git commit -m "Added CPI responses & diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No new changes"
          git push
