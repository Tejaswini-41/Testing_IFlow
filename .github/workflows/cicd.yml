name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Payload file name (used for both iFlows)'
        required: false
        default: 'payload.json'
      iflow_base_url:
        description: 'CPI Old Mapping Endpoint'
        required: true
      iflow_current_url:
        description: 'CPI Current Mapping Endpoint'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write 

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest
    environment:
      name: github-pages


    steps:
      # -------------------- Checkout --------------------
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------- Dependencies --------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson requests

      - name: Create results folder
        run: mkdir -p results

      # -------------------- 🔐 Fetch OAuth Token --------------------
      - name: Fetch OAuth Token
        env:
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          echo "🔐 Fetching OAuth token from $TOKEN_URL ..."
          python3 - <<'EOF'
          import os, requests

          token_url = os.getenv("TOKEN_URL")
          client_id = os.getenv("CLIENT_ID")
          client_secret = os.getenv("CLIENT_SECRET")

          if not all([token_url, client_id, client_secret]):
              print("❌ Missing secrets (TOKEN_URL, CLIENT_ID, CLIENT_SECRET).")
              exit(1)

          try:
              resp = requests.post(
                  token_url,
                  data={"grant_type": "client_credentials"},
                  auth=(client_id, client_secret)
              )
          except Exception as e:
              print("❌ Token request failed:", e)
              exit(1)

          if resp.status_code != 200:
              print(f"❌ Token request failed ({resp.status_code}):", resp.text)
              exit(1)

          token = resp.json().get("access_token")
          if not token:
              print("❌ No access_token found:", resp.text)
              exit(1)

          os.makedirs("results", exist_ok=True)
          with open("results/oauth_token.txt", "w") as f:
              f.write(token)

          print("✅ Token fetched and saved to results/oauth_token.txt")
          EOF

      # -------------------- 🌐 Hit Old CPI iFlow --------------------
      - name: Hit CPI iFlow (Old Mapping)
        run: |
          echo "📡 Fetching Response 1 from ${{ github.event.inputs.iflow_base_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_base_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/response_base.txt
          echo "✅ Response 1 saved to results/response_base.txt"

      # -------------------- 🌐 Hit Current CPI iFlow --------------------
      - name: Hit CPI iFlow (Current Mapping)
        run: |
          echo "📡 Fetching Response 2 from ${{ github.event.inputs.iflow_current_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_current_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/response_current.txt
          echo "✅ Response 2 saved to results/response_current.txt"

      # -------------------- 🔍 Compare JSON/XML Responses --------------------
      - name: Compare responses (smart JSON/XML diff)
        run: |
          echo "🔍 Comparing responses..."
          pip install deepdiff
          python3 - <<'EOF'
          import os, json, difflib
          from deepdiff import DeepDiff

          base_path = "results/response_base.txt"
          current_path = "results/response_current.txt"
          diff_path = "results/diff.txt"

          def is_json_file(path):
              """Check if file is JSON by trying to load it."""
              try:
                  with open(path, 'r') as f:
                      json.load(f)
                  return True
              except Exception:
                  return False

          def compare_json(base_path, current_path):
              with open(base_path, 'r') as f1, open(current_path, 'r') as f2:
                  base_data = json.load(f1)
                  current_data = json.load(f2)
              diff = DeepDiff(base_data, current_data, ignore_order=True, verbose_level=2)
              with open(diff_path, 'w') as f:
                  json.dump(diff, f, indent=2, ensure_ascii=False)
              print("✅ JSON diff saved to results/diff.txt")

          def compare_text(base_path, current_path):
              with open(base_path) as f1, open(current_path) as f2:
                  base_lines, current_lines = f1.readlines(), f2.readlines()
              diff = difflib.unified_diff(
                  base_lines, current_lines,
                  fromfile="Response_Base",
                  tofile="Response_Current",
                  lineterm="",
                  n=0
              )
              with open(diff_path, "w") as f:
                  f.writelines(diff)
              print("✅ Text diff saved to results/diff.txt")

          # --- Logic switch ---
          if is_json_file(base_path) and is_json_file(current_path):
              compare_json(base_path, current_path)
          else:
              compare_text(base_path, current_path)
          EOF

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        run: |
          pip install pandas plotly kaleido
          python3 dashboard.py results/diff.txt

      # -------------------- 🧾 Commit Results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Upload artifact for GitHub Pages --------------------
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

      # -------------------- 🚀 Deploy Dashboard --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          URL="${{ steps.deploy.outputs.page_url }}/diff_dashboard.html"
          echo "✅ Dashboard published at: $URL"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 All done!"
      - name: Send static data back to Postman
        run: |
          curl -X POST https://b01867a9-d0f8-4e8d-b43e-622a7e24984a.mock.pstmn.io/github-callback \
          -H "Content-Type: application/json" \
          -d '{"status":"success","URL":"https://tejaswini-41.github.io/Testing_IFlow//diff_dashboard.html"}'
