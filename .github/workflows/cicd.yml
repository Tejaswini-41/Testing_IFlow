name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Payload file name (used for both iFlows)'
        required: false
        default: 'payload.json'
      iflow_base_url:
        description: 'CPI Old Mapping Endpoint'
        required: true
      iflow_current_url:
        description: 'CPI Current Mapping Endpoint'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest

    steps:
      # -------------------- Checkout --------------------
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------- Dependencies --------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson requests pandas plotly kaleido

      - name: Create results folder
        run: mkdir -p results

      # -------------------- 🔐 Fetch OAuth Token --------------------
      - name: Fetch OAuth Token
        run: |
          echo "🔐 Fetching OAuth token..."
          RESPONSE=$(curl -s -X POST "https://syn-int-suite-ent-qgjsk2hi.authentication.eu10.hana.ondemand.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=sb-369e182722" \
            -d "client_secret=fddd335f-2b50-48b5-848d-8be95d87c47b$VA=")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to fetch access token."
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "$ACCESS_TOKEN" > results/oauth_token.txt
          echo "✅ Access token saved."

      # -------------------- 🌐 Hit Old CPI iFlow --------------------
      - name: Hit CPI iFlow (Old Mapping)
        run: |
          echo "📡 Fetching Response 1 from ${{ github.event.inputs.iflow_base_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_base_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/response_base.txt
          echo "✅ Response 1 saved."

      # -------------------- 🌐 Hit Current CPI iFlow --------------------
      - name: Hit CPI iFlow (Current Mapping)
        run: |
          echo "📡 Fetching Response 2 from ${{ github.event.inputs.iflow_current_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_current_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file }} \
            -o results/response_current.txt
          echo "✅ Response 2 saved."

      # -------------------- 🔍 Compare JSON/XML Responses --------------------
      - name: Compare responses (prettified)
        run: |
          echo "🔍 Comparing responses..."
          python3 - <<'EOF'
          import json, difflib, os

          base_path = "results/response_base.txt"
          current_path = "results/response_current.txt"
          pretty_base = "results/response_base_pretty.json"
          pretty_current = "results/response_current_pretty.json"
          diff_path = "results/diff.txt"

          def prettify_json(input_path, output_path):
              try:
                  with open(input_path, 'r') as f:
                      content = f.read().strip()
                      if content.startswith("<"):
                          open(output_path, "w").write(content)
                          return False
                      data = json.loads(content)
                  with open(output_path, 'w') as f:
                      json.dump(data, f, indent=2, sort_keys=True)
                  return True
              except Exception as e:
                  open(output_path, "w").write(open(input_path).read())
                  print(f"⚠️ Warning: Could not parse {input_path} as JSON ({e})")
                  return False

          prettify_json(base_path, pretty_base)
          prettify_json(current_path, pretty_current)

          with open(pretty_base) as f1, open(pretty_current) as f2:
              base_lines = f1.readlines()
              current_lines = f2.readlines()

          diff = difflib.unified_diff(
              base_lines, current_lines,
              fromfile="Response_Base",
              tofile="Response_Current",
              lineterm=""
          )

          os.makedirs("results", exist_ok=True)
          with open(diff_path, "w") as f:
              f.writelines(diff)

          print("✅ Diff saved to results/diff.txt")
          EOF

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        run: python3 dashboard.py results/diff.txt

      # -------------------- 🧾 Commit Results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Upload artifact for GitHub Pages --------------------
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

      # -------------------- 🚀 Deploy Dashboard --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          echo "✅ Dashboard published at: ${{ steps.deploy.outputs.page_url }}/diff_dashboard.html"
          echo "🎉 All done!"

