name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'CPI Mapping Endpoint'
        required: true
 
      payload_file:
        description: 'Payload file name in repo root (e.g., requestpayload.json)'
        required: false
        default: 'requestpayload.json'
 
      target_file_name:
        description: 'Current response file name (saved under results/)'
        required: true
        default: 'response_current.json'
 
      upload_base_response_file:
        description: 'Optional existing base response file name under results/ to compare against'
        required: false
 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # -------------------- 📥 Checkout --------------------
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------- ⚙️ Dependencies --------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson requests deepdiff pandas plotly kaleido

      - name: Create results folder
        run: mkdir -p results

      # -------------------- 🔐 Fetch OAuth Token --------------------
      - name: Fetch OAuth Token
        env:
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          echo "🔐 Fetching OAuth token from $TOKEN_URL ..."
          python3 - <<'EOF'
          import os, requests

          token_url = os.getenv("TOKEN_URL")
          client_id = os.getenv("CLIENT_ID")
          client_secret = os.getenv("CLIENT_SECRET")

          if not all([token_url, client_id, client_secret]):
              print("❌ Missing secrets (TOKEN_URL, CLIENT_ID, CLIENT_SECRET).")
              exit(1)

          try:
              resp = requests.post(
                  token_url,
                  data={"grant_type": "client_credentials"},
                  auth=(client_id, client_secret)
              )
          except Exception as e:
              print("❌ Token request failed:", e)
              exit(1)

          if resp.status_code != 200:
              print(f"❌ Token request failed ({resp.status_code}):", resp.text)
              exit(1)

          token = resp.json().get("access_token")
          if not token:
              print("❌ No access_token found:", resp.text)
              exit(1)

          os.makedirs("results", exist_ok=True)
          with open("results/oauth_token.txt", "w") as f:
              f.write(token)

          print("✅ Token fetched and saved to results/oauth_token.txt")
          EOF

      # -------------------- 🌐 Hit CPI iFlow (Single Request) --------------------
      - name: Hit CPI iFlow
        run: |
          echo "📡 Fetching response (headers + body) from ${{ github.event.inputs.iflow_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"
          TARGET_NAME="${{ github.event.inputs.target_file_name }}"
          PAYLOAD_FILE="${{ github.event.inputs.payload_file }}"
          CURRENT_HEADERS="results/headers_current.txt"
          CURRENT_BODY="results/${TARGET_NAME}"

          if [ ! -f "$PAYLOAD_FILE" ]; then
            echo "❌ Payload file '$PAYLOAD_FILE' not found in repository root."
            exit 1
          fi

          echo "➡️ Using payload file: $PAYLOAD_FILE"

          curl -s -X POST "${{ github.event.inputs.iflow_url }}" \
            -D "$CURRENT_HEADERS" \
            -o "$CURRENT_BODY" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @"$PAYLOAD_FILE"

          echo "✅ Response saved:"
          echo " - $CURRENT_HEADERS"
          echo " - $CURRENT_BODY"

      # -------------------- 🔍 Determine Base and Compare --------------------
      - name: Determine base response and compare
        run: |
          echo "🔍 Determining base response and comparing..."

          python3 - <<'EOF'
          import os, json, difflib, shutil
          from deepdiff import DeepDiff
          from pathlib import Path

          RESULTS_DIR = Path("results")
          RESULTS_DIR.mkdir(parents=True, exist_ok=True)

          target_name = os.getenv("TARGET_NAME", "") or "${{ github.event.inputs.target_file_name }}"
          uploaded_base_name = os.getenv("UPLOADED_BASE_NAME", "") or "${{ github.event.inputs.upload_base_response_file or '' }}"

          current_body = RESULTS_DIR / target_name
          current_headers = RESULTS_DIR / "headers_current.txt"

          # Preferred base path if user specified/uploaded a base file name under results/
          candidate_uploaded_base = RESULTS_DIR / uploaded_base_name if uploaded_base_name else None
          # Fallback baseline location we manage automatically per target
          managed_base = RESULTS_DIR / f"base_{target_name}"

          def compare_json(base_path, current_path, out_path):
              try:
                  with open(base_path) as f1, open(current_path) as f2:
                      base_data = json.load(f1)
                      current_data = json.load(f2)
                  diff = DeepDiff(base_data, current_data, ignore_order=True, verbose_level=2)
                  with open(out_path, 'w', encoding='utf-8') as f:
                      f.write(json.dumps(diff, indent=2, ensure_ascii=False))
                  print(f"✅ JSON diff saved to {out_path}")
              except Exception as e:
                  print(f"⚠️ JSON diff failed, falling back to text: {e}")
                  compare_text(base_path, current_path, out_path)

          def compare_text(base_path, current_path, out_path):
              with open(base_path) as f1, open(current_path) as f2:
                  base_lines, current_lines = f1.readlines(), f2.readlines()
              diff = list(difflib.unified_diff(
                  base_lines, current_lines,
                  fromfile=base_path,
                  tofile=current_path,
                  lineterm=""
              ))
              with open(out_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(diff))
              print(f"✅ Text diff (with +/-) saved to {out_path}")

          # Determine base path per rules:
          base_path = None
          if candidate_uploaded_base and candidate_uploaded_base.name and candidate_uploaded_base.exists():
              base_path = candidate_uploaded_base
              print(f"ℹ️ Using uploaded base file: {base_path}")
          elif managed_base.exists():
              base_path = managed_base
              print(f"ℹ️ Using existing managed base file: {base_path}")
          else:
              # No base available: save current as new base for future comparisons
              shutil.copyfile(current_body, managed_base)
              print(f"🆕 No base found. Saved current as new base for future comparisons: {managed_base}")
              # Produce empty diff file to indicate baseline creation
              open(RESULTS_DIR / "diff.txt", "w", encoding="utf-8").write("Baseline created. No comparison performed on first run.")
              # Also produce headers diff stub
              open(RESULTS_DIR / "diff_headers.txt", "w", encoding="utf-8").write("Baseline created. No headers comparison performed on first run.")
              # Exit early
              raise SystemExit(0)

          # --- Compare Headers (only one current set; diff stub since no prior headers tracked) ---
          # If we later decide to manage a headers baseline, adapt similar to body baseline.
          # For now, write a no-op info message.
          with open(RESULTS_DIR / "diff_headers.txt", "w", encoding="utf-8") as f:
              f.write("Headers baseline not tracked. Only current headers captured in results/headers_current.txt")

          # --- Compare Response Body ---
          try:
              with open(base_path) as f:
                  json.load(f)
              with open(current_body) as f:
                  json.load(f)
              compare_json(str(base_path), str(current_body), str(RESULTS_DIR / "diff.txt"))
          except Exception:
              compare_text(str(base_path), str(current_body), str(RESULTS_DIR / "diff.txt"))
          EOF

          echo "✅ Generated:"
          echo " - results/diff.txt (Response body diff)"
          echo " - results/diff_headers.txt (Headers diff)"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        run: |
          python3 dashboard.py results/diff.txt

      # -------------------- 🧾 Commit Results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Upload artifact for GitHub Pages --------------------
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

      # -------------------- 🚀 Deploy Dashboard --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"  # Remove trailing slash if any
          URL="$BASE_URL/diff_dashboard.html"
          echo "✅ Dashboard published at: $URL"
          echo "::notice title=Dashboard URL::$URL"
          echo "🎉 All done!"
