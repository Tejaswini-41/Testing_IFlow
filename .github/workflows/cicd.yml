name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      payload_file1:
        description: 'First Payload file name'
        required: false
        default: 'payload1.json'

      payload_file2:
        description: 'Second Payload file name'
        required: false
        default: 'payload2.json'
        
      iflow_base_url:
        description: 'CPI Old Mapping Endpoint'
        required: true
      iflow_current_url:
        description: 'CPI Current Mapping Endpoint'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # -------------------- 📥 Checkout --------------------
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------- ⚙️ Dependencies --------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson requests deepdiff pandas plotly kaleido

      - name: Create results folder
        run: mkdir -p results

      # -------------------- 🔐 Fetch OAuth Token --------------------
      - name: Fetch OAuth Token
        env:
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          echo "🔐 Fetching OAuth token from $TOKEN_URL ..."
          python3 - <<'EOF'
          import os, requests

          token_url = os.getenv("TOKEN_URL")
          client_id = os.getenv("CLIENT_ID")
          client_secret = os.getenv("CLIENT_SECRET")

          if not all([token_url, client_id, client_secret]):
              print("❌ Missing secrets (TOKEN_URL, CLIENT_ID, CLIENT_SECRET).")
              exit(1)

          try:
              resp = requests.post(
                  token_url,
                  data={"grant_type": "client_credentials"},
                  auth=(client_id, client_secret)
              )
          except Exception as e:
              print("❌ Token request failed:", e)
              exit(1)

          if resp.status_code != 200:
              print(f"❌ Token request failed ({resp.status_code}):", resp.text)
              exit(1)

          token = resp.json().get("access_token")
          if not token:
              print("❌ No access_token found:", resp.text)
              exit(1)

          os.makedirs("results", exist_ok=True)
          with open("results/oauth_token.txt", "w") as f:
              f.write(token)

          print("✅ Token fetched and saved to results/oauth_token.txt")
          EOF

      # -------------------- 🌐 Hit CPI iFlow (Old Mapping) --------------------
      - name: Hit CPI iFlow (Old Mapping)
        run: |
          echo "📡 Fetching Response 1 (headers + body) from ${{ github.event.inputs.iflow_base_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_base_url }}" \
            -D results/headers_base.txt \
            -o results/response_base.txt \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file1 }}

          echo "✅ Response 1 saved (headers_base.txt + response_base.txt)"

      # -------------------- 🌐 Hit CPI iFlow (Current Mapping) --------------------
      - name: Hit CPI iFlow (Current Mapping)
        run: |
          echo "📡 Fetching Response 2 (headers + body) from ${{ github.event.inputs.iflow_current_url }}"
          TOKEN=$(cat results/oauth_token.txt)
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          curl -s -X POST "${{ github.event.inputs.iflow_current_url }}" \
            -D results/headers_current.txt \
            -o results/response_current.txt \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file2 }}

          echo "✅ Response 2 saved (headers_current.txt + response_current.txt)"

      # -------------------- 🔍 Compare Responses and Headers --------------------
      - name: Compare headers and responses
        run: |
          echo "🔍 Comparing response headers and body..."

          python3 - <<'EOF'
          import os, json, difflib
          from deepdiff import DeepDiff

          def compare_json(base_path, current_path, out_path):
              try:
                  with open(base_path) as f1, open(current_path) as f2:
                      base_data = json.load(f1)
                      current_data = json.load(f2)
                  diff = DeepDiff(base_data, current_data, ignore_order=True, verbose_level=2)
                  with open(out_path, 'w', encoding='utf-8') as f:
                      f.write(json.dumps(diff, indent=2, ensure_ascii=False))
                  print(f"✅ JSON diff saved to {out_path}")
              except Exception as e:
                  print(f"⚠️ JSON diff failed, falling back to text: {e}")
                  compare_text(base_path, current_path, out_path)

          def compare_text(base_path, current_path, out_path):
              with open(base_path) as f1, open(current_path) as f2:
                  base_lines, current_lines = f1.readlines(), f2.readlines()
              diff = list(difflib.unified_diff(
                  base_lines, current_lines,
                  fromfile=base_path,
                  tofile=current_path,
                  lineterm=""
              ))
              with open(out_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(diff))
              print(f"✅ Text diff (with +/-) saved to {out_path}")

          # --- Compare Headers ---
          compare_text("results/headers_base.txt", "results/headers_current.txt", "results/diff_headers.txt")

          # --- Compare Response Body ---
          base_body = "results/response_base.txt"
          current_body = "results/response_current.txt"

          try:
              with open(base_body) as f:
                  json.load(f)
              with open(current_body) as f:
                  json.load(f)
              compare_json(base_body, current_body, "results/diff.txt")
          except Exception:
              compare_text(base_body, current_body, "results/diff.txt")
          EOF

          echo "✅ Generated:"
          echo " - results/diff.txt (Response body diff)"
          echo " - results/diff_headers.txt (Headers diff)"

      # -------------------- 📊 Generate Diff Dashboard --------------------
      - name: Generate Diff Dashboard
        run: |
          python3 dashboard.py results/diff.txt

      # -------------------- 🧾 Commit Results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # -------------------- 🌐 Upload artifact for GitHub Pages --------------------
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

      # -------------------- 🚀 Deploy Dashboard --------------------
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -------------------- 🔗 Print Dashboard URL --------------------
      - name: Dashboard URL
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          echo "🎉 All done!"
