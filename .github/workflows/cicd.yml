name: CPI Response Compare

on:
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      payload_file_base:
        description: 'Base payload file name'
        required: false
        default: 'payload.json'
      payload_file_actual:
        description: 'Actual payload file name'
        required: false
        default: 'payload_current.json'

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest
    env:
      CPI_USER: ${{ secrets.CPI_USER }}
      CPI_PASS: ${{ secrets.CPI_PASS }}
    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson

      - name: Create results folder
        run: mkdir -p results

      # -------------------- Task 1: Fetch from old mapping --------------------
      - name: Hit CPI iFlow (old mapping)
        run: |
          echo "Fetching Response 1 from ${IFLOW_BASE_URL}"
          curl -s -X POST "${IFLOW_BASE_URL}" \
            -u "${CPI_USER}:${CPI_PASS}" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_base }} \
            -o results/response_base.json
          echo "✅ Response 1 saved to results/response_base.json"

      # -------------------- Task 2: Fetch from new mapping --------------------
      - name: Hit CPI iFlow (new mapping)
        run: |
          echo "Fetching Response 2 from ${IFLOW_NEW_URL}"
          curl -s -X POST "${IFLOW_NEW_URL}" \
            -u "${CPI_USER}:${CPI_PASS}" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_actual }} \
            -o results/response_actual.json
          echo "✅ Response 2 saved to results/response_actual.json"

      # -------------------- Compare responses --------------------
      - name: Compare responses
        run: |
          echo "Comparing JSON responses..."
          python3 - <<'EOF'
          import json, difflib, os

          base_path = "results/response_base.json"
          actual_path = "results/response_actual.json"
          diff_path = "results/diff.txt"

          with open(base_path) as f1, open(actual_path) as f2:
              base_json = json.dumps(json.load(f1), indent=2, sort_keys=True)
              actual_json = json.dumps(json.load(f2), indent=2, sort_keys=True)

          diff = difflib.unified_diff(
              base_json.splitlines(),
              actual_json.splitlines(),
              fromfile="Response_1 (Old Mapping)",
              tofile="Response_2 (New Mapping)",
              lineterm=""
          )

          os.makedirs("results", exist_ok=True)
          with open(diff_path, "w") as f:
              f.write("\n".join(diff))

          print("✅ Differences saved to results/diff.txt")
          EOF

      # -------------------- Commit & push results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

