name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      payload_file_base:
        description: 'Base payload file name'
        required: false
        default: 'payload.json'
      payload_file_actual:
        description: 'Actual payload file name'
        required: false
        default: 'payload.json'
      auth_type:
        description: 'Authorization type (Basic or Bearer)'
        required: true
        default: 'Basic'
      auth_value:
        description: 'Authorization value (Base64 or Bearer Token)'
        required: true
      iflow_base_url:
        description: 'CPI Old Mapping Endpoint'
        required: true
      iflow_new_url:
        description: 'CPI New Mapping Endpoint'
        required: true

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson

      - name: Create results folder
        run: mkdir -p results

      # -------------------- Fetch from old mapping --------------------
      - name: Hit CPI iFlow (old mapping)
        run: |
          echo "Fetching Response 1 from ${{ github.event.inputs.iflow_base_url }}"
          if [ "${{ github.event.inputs.auth_type }}" = "Basic" ]; then
            AUTH_HEADER="Authorization: Basic ${{ github.event.inputs.auth_value }}"
          else
            AUTH_HEADER="Authorization: Bearer ${{ github.event.inputs.auth_value }}"
          fi

          curl -s -X POST "${{ github.event.inputs.iflow_base_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_base }} \
            -o results/response_base.json
          echo "✅ Response 1 saved to results/response_base.json"

      # -------------------- Fetch from new mapping --------------------
      - name: Hit CPI iFlow (new mapping)
        run: |
          echo "Fetching Response 2 from ${{ github.event.inputs.iflow_new_url }}"
          if [ "${{ github.event.inputs.auth_type }}" = "Basic" ]; then
            AUTH_HEADER="Authorization: Basic ${{ github.event.inputs.auth_value }}"
          else
            AUTH_HEADER="Authorization: Bearer ${{ github.event.inputs.auth_value }}"
          fi

          curl -s -X POST "${{ github.event.inputs.iflow_new_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_actual }} \
            -o results/response_actual.json
          echo "✅ Response 2 saved to results/response_actual.json"

      # -------------------- Compare responses --------------------
      - name: Compare responses
        run: |
          echo "Comparing JSON responses..."
          python3 - <<'EOF'
          import json, difflib, os

          base_path = "results/response_base.json"
          actual_path = "results/response_actual.json"
          diff_path = "results/diff.txt"

          with open(base_path) as f1, open(actual_path) as f2:
              base_json = json.dumps(json.load(f1), indent=2, sort_keys=True)
              actual_json = json.dumps(json.load(f2), indent=2, sort_keys=True)

          diff = difflib.unified_diff(
              base_json.splitlines(),
              actual_json.splitlines(),
              fromfile="Response_1 (Old Mapping)",
              tofile="Response_2 (New Mapping)",
              lineterm=""
          )

          os.makedirs("results", exist_ok=True)
          with open(diff_path, "w") as f:
              f.write("\n".join(diff))

          print("✅ Differences saved to results/diff.txt")
          EOF

      # -------------------- Commit & push results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
