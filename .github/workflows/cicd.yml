name: CPI Response Compare

on:
  workflow_dispatch:
    inputs:
      payload_file_base:
        description: 'Base payload file name'
        required: false
        default: 'payload.json'
      payload_file_current:
        description: 'Current payload file name'
        required: false
        default: 'payload_current.json'
      auth_type:
        description: 'Authorization type (Basic or Bearer)'
        required: true
        default: 'Basic'
      auth_value:
        description: 'Authorization value (only for Basic auth, Base64 encoded username:password)'
        required: false
        default: ''
      iflow_base_url:
        description: 'CPI Old Mapping Endpoint'
        required: true
      iflow_current_url:
        description: 'CPI Current Mapping Endpoint'
        required: true

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip install simplejson requests

      - name: Create results folder
        run: mkdir -p results

      # -------------------- Fetch OAuth Token (only for Bearer) --------------------
      - name: Fetch OAuth Token (if Bearer)
        if: ${{ github.event.inputs.auth_type == 'Bearer' }}
        env:
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          echo "Fetching OAuth token from $TOKEN_URL ..."
          python3 - <<'EOF'
          import os, requests, json

          token_url = os.getenv("TOKEN_URL")
          client_id = os.getenv("CLIENT_ID")
          client_secret = os.getenv("CLIENT_SECRET")

          if not all([token_url, client_id, client_secret]):
              print("❌ Missing one or more secrets (TOKEN_URL, CLIENT_ID, CLIENT_SECRET).")
              exit(1)

          data = {
              "grant_type": "client_credentials",
              "client_id": client_id,
              "client_secret": client_secret
          }

          try:
              resp = requests.post(token_url, data=data)
          except Exception as e:
              print("❌ Request failed:", e)
              exit(1)

          if resp.status_code != 200:
              print(f"❌ Token request failed ({resp.status_code}):", resp.text)
              exit(1)

          token = resp.json().get("access_token")
          if not token:
              print("❌ No access_token in response:", resp.text)
              exit(1)

          os.makedirs("results", exist_ok=True)
          with open("results/oauth_token.txt", "w") as f:
              f.write(token)

          print("✅ Token fetched and saved to results/oauth_token.txt")
          EOF

      # -------------------- Fetch from old mapping --------------------
      - name: Hit CPI iFlow (old mapping)
        run: |
          echo "Fetching Response 1 from ${{ github.event.inputs.iflow_base_url }}"
          if [ "${{ github.event.inputs.auth_type }}" = "Basic" ]; then
            AUTH_HEADER="Authorization: Basic ${{ github.event.inputs.auth_value }}"
          else
            TOKEN=$(cat results/oauth_token.txt)
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi

          curl -s -X POST "${{ github.event.inputs.iflow_base_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_base }} \
            -o results/response_base.txt
          echo "✅ Response 1 saved to results/response_base.txt"

      # -------------------- Fetch from current mapping --------------------
      - name: Hit CPI iFlow (current mapping)
        run: |
          echo "Fetching Response 2 from ${{ github.event.inputs.iflow_current_url }}"
          if [ "${{ github.event.inputs.auth_type }}" = "Basic" ]; then
            AUTH_HEADER="Authorization: Basic ${{ github.event.inputs.auth_value }}"
          else
            TOKEN=$(cat results/oauth_token.txt)
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi

          curl -s -X POST "${{ github.event.inputs.iflow_current_url }}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-binary @${{ github.event.inputs.payload_file_current }} \
            -o results/response_current.txt
          echo "✅ Response 2 saved to results/response_current.txt"

      # -------------------- Compare responses --------------------
      - name: Compare responses (prettified)
        run: |
          echo "Comparing responses in readable format..."
          python3 - <<'EOF'
          import json, difflib, os

          base_path = "results/response_base.txt"
          current_path = "results/response_current.txt"
          pretty_base = "results/response_base_pretty.json"
          pretty_current = "results/response_current_pretty.json"
          diff_path = "results/diff.txt"

          def prettify_json(input_path, output_path):
              try:
                  with open(input_path, 'r') as f:
                      content = f.read().strip()
                      if content.startswith("<"):  # Handle XML responses
                          open(output_path, "w").write(content)
                          return False
                      data = json.loads(content)
                  with open(output_path, 'w') as f:
                      json.dump(data, f, indent=2, sort_keys=True)
                  return True
              except Exception as e:
                  open(output_path, "w").write(open(input_path).read())
                  print(f"⚠️ Warning: Could not parse {input_path} as JSON ({e})")
                  return False

          # Prettify both responses
          prettify_json(base_path, pretty_base)
          prettify_json(current_path, pretty_current)

          # Generate diff
          with open(pretty_base, 'r') as f1, open(pretty_current, 'r') as f2:
              base_lines = f1.readlines()
              current_lines = f2.readlines()

          diff = difflib.unified_diff(
              base_lines,
              current_lines,
              fromfile="Response_Base",
              tofile="Response_Current",
              lineterm=""
          )

          os.makedirs("results", exist_ok=True)
          with open(diff_path, "w") as f:
              f.writelines(diff)

          print("✅ Human-readable diff saved to results/diff.txt")
          EOF
  # -------------------- Pretty Print Diff --------------------
      - name: Pretty Print Diff
        run: |
          echo "🪷 Generating Pretty Output..."
          python3 pretty_diff.py
      # -------------------- Commit & push results --------------------
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A results/
          git commit -m "CPI responses and diff on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
