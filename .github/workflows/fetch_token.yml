name: Fetch OAuth Token

on:
  workflow_dispatch:
    inputs:
      token_url:
        description: 'OAuth Token URL'
        required: true
      client_id:
        description: 'Client ID'
        required: true
      client_secret:
        description: 'Client Secret'
        required: true

permissions:
  contents: write

jobs:
  fetch_token:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch OAuth Token
        env:
          TOKEN_URL: ${{ github.event.inputs.token_url }}
          CLIENT_ID: ${{ github.event.inputs.client_id }}
          CLIENT_SECRET: ${{ github.event.inputs.client_secret }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, base64, json
          from pathlib import Path

          token_url = os.environ["TOKEN_URL"]
          client_id = os.environ["CLIENT_ID"]
          client_secret = os.environ["CLIENT_SECRET"]

          print(f"🔐 Fetching token from: {token_url}")
          try:
              creds_b64 = base64.b64encode(
                  f"{client_id}:{client_secret}".encode()
              ).decode()
              resp = requests.post(
                  token_url,
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded",
                      "Authorization": f"Basic {creds_b64}"
                  },
                  data="grant_type=client_credentials",
                  timeout=30
              )
              print(f"Try 1 (Basic header) status: {resp.status_code}")
              
              if resp.status_code != 200:
                  # Try 2: Credentials in body instead
                  resp = requests.post(
                      token_url,
                      headers={
                          "Content-Type": "application/x-www-form-urlencoded"
                      },
                      data={
                          "grant_type": "client_credentials",
                          "client_id": client_id,
                          "client_secret": client_secret
                      },
                      timeout=30
                  )
                  print(f"Try 2 (body credentials) status: {resp.status_code}")
              if resp.status_code != 200:
                  result = {
                      "error": f"HTTP {resp.status_code}: {resp.text[:300]}"
                  }
                  print(f"❌ Token fetch failed: {result['error']}")
              else:
                  data = resp.json()
                  access_token = data.get("access_token", "")
                  if not access_token:
                      result = {"error": "No access_token in response"}
                  else:
                      result = {"access_token": access_token}
                      print("✅ Token fetched successfully!")
          except Exception as e:
              result = {"error": str(e)}
              print(f"❌ Exception: {e}")

          Path("results").mkdir(exist_ok=True)
          Path("results/fetched_token.txt").write_text(json.dumps(result))
          PYEOF

      - name: Commit token result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/fetched_token.txt
          git commit -m "Fetched OAuth token result" || echo "No changes"
          git push

      - name: Fail if token fetch failed
        run: |
          python3 -c "
          import json
          data = json.loads(open('results/fetched_token.txt').read())
          if 'error' in data:
              print('❌ Token fetch failed:', data['error'])
              exit(1)
          print('✅ Token fetch succeeded')
          "
