name: Performance Test

on:
  workflow_dispatch:
    inputs:
      iflow_url:
        description: 'iFlow URL to test'
        required: true

      http_method:
        description: 'HTTP Method (GET, POST, PUT, PATCH, DELETE)'
        required: false
        default: 'POST'

      token:
        description: 'Auth token or credentials'
        required: true

      auth_type:
        description: 'Auth type (oauth, basic, none)'
        required: true
        default: 'oauth'

      request_headers:
        description: 'Request headers JSON'
        required: true
        default: '{}'

      test_type:
        description: 'Type of test: load or spike'
        required: true
        default: 'load'

      # Load Test input
      num_requests:
        description: 'Number of requests (Load Test only, max 50)'
        required: false
        default: '10'

      # Spike Test inputs
      baseline_requests:
        description: 'Baseline requests before and after spike'
        required: false
        default: '3'

      spike_requests:
        description: 'Number of requests during spike burst'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  performance_test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Create results folder
        run: mkdir -p results

      - name: Clean old performance results
        run: |
          if [ -f results/performance_report.json ]; then
            rm results/performance_report.json
            echo "🗑️ Removed old performance_report.json"
          else
            echo "✅ No old report to clean"
          fi

      - name: Run Performance Test
        id: perf_test
        run: |
          python3 - <<'PYEOF'
          import json, time, base64, sys, os
          import requests
          import threading
          from pathlib import Path
          from datetime import datetime

          # ─────────────────────────────────────────
          # Inputs
          # ─────────────────────────────────────────
          url         = "${{ github.event.inputs.iflow_url }}"
          method      = "${{ github.event.inputs.http_method }}".upper()
          token       = "${{ github.event.inputs.token }}"
          auth_type   = "${{ github.event.inputs.auth_type }}".lower()
          headers_raw = r'''${{ github.event.inputs.request_headers }}'''
          test_type   = "${{ github.event.inputs.test_type }}".lower()

          # Load test
          num_requests     = min(int("${{ github.event.inputs.num_requests }}"), 50)

          # Spike test
          baseline_requests = int("${{ github.event.inputs.baseline_requests }}")
          spike_requests    = int("${{ github.event.inputs.spike_requests }}")

          # ─────────────────────────────────────────
          # Build headers
          # ─────────────────────────────────────────
          try:
              user_headers = json.loads(headers_raw) if headers_raw.strip() else {}
          except json.JSONDecodeError:
              user_headers = {}

          if not any(k.lower() == "content-type" for k in user_headers):
              user_headers["Content-Type"] = "application/json"

          if auth_type == "basic":
              basic_b64 = base64.b64encode(token.encode()).decode()
              user_headers["Authorization"] = f"Basic {basic_b64}"
          elif auth_type != "none":
              user_headers["Authorization"] = f"Bearer {token}"

          # ─────────────────────────────────────────
          # Load payload if exists
          # ─────────────────────────────────────────
          payload = None
          payload_file = Path("Payload.json")
          if method != "GET" and payload_file.exists():
              try:
                  payload = json.loads(payload_file.read_text())
                  print("✅ Payload loaded from Payload.json")
              except Exception as e:
                  print(f"⚠️ Could not load payload: {e}")

          # ─────────────────────────────────────────
          # Single request function
          # ─────────────────────────────────────────
          def send_request(req_number, label=""):
              result = {
                  "request_num": req_number,
                  "label": label,
                  "status": "Failed",
                  "status_code": None,
                  "response_time_ms": None,
                  "response_size": 0,
                  "success": False,
                  "error": None
              }
              try:
                  kwargs = {"headers": user_headers, "timeout": 60}
                  if method in ("POST", "PUT", "PATCH") and payload:
                      kwargs["json"] = payload

                  start = time.time()
                  resp = requests.request(method, url, **kwargs)
                  elapsed = round((time.time() - start) * 1000)

                  result["status_code"]       = resp.status_code
                  result["response_time_ms"]  = elapsed
                  result["response_size"]     = len(resp.content) if resp.content else 0
                  result["success"]           = resp.status_code < 400
                  result["status"]            = "Success" if result["success"] else "Failed"
                  
                  print(f"  {'✅' if result['success'] else '❌'} [{label}] Request {req_number} → {resp.status_code} in {elapsed}ms ({result['response_size']}B)")

              except Exception as e:
                  result["error"] = str(e)
                  print(f"  ❌ [{label}] Request {req_number} → Exception: {e}")

              return result

          # ─────────────────────────────────────────
          # Calculate stats helper
          # ─────────────────────────────────────────
          def calc_stats(times):
              if not times:
                  return {}
              times_sorted = sorted(times)
              p95_idx = int(len(times_sorted) * 0.95) - 1
              p95_idx = max(0, p95_idx)
              return {
                  "min_ms": min(times_sorted),
                  "max_ms": max(times_sorted),
                  "avg_ms": round(sum(times_sorted) / len(times_sorted)),
                  "p95_ms": times_sorted[p95_idx]
              }

          # ─────────────────────────────────────────
          # LOAD TEST — sequential requests
          # ─────────────────────────────────────────
          all_results = []

          if test_type == "load":
              print(f"\n🚀 Starting Load Test — {num_requests} sequential requests\n")
              for i in range(1, num_requests + 1):
                  result = send_request(i, label="LOAD")
                  all_results.append(result)

          # ─────────────────────────────────────────
          # SPIKE TEST — baseline → burst → baseline
          # ─────────────────────────────────────────
          elif test_type == "spike":
              print(f"\n🚀 Starting Spike Test")
              print(f"   Baseline: {baseline_requests} sequential requests")
              print(f"   Spike:    {spike_requests} parallel requests")
              print(f"   Baseline: {baseline_requests} sequential requests again\n")

              # Phase 1: Baseline before spike (sequential)
              print("📋 Phase 1: Baseline (before spike)")
              req_counter = 1
              for i in range(baseline_requests):
                  result = send_request(req_counter, label="BASELINE_BEFORE")
                  all_results.append(result)
                  req_counter += 1

              # Phase 2: Spike (parallel using threads)
              print(f"\n⚡ Phase 2: Spike — firing {spike_requests} requests simultaneously!")
              spike_results = [None] * spike_requests
              lock = threading.Lock()

              def spike_worker(idx):
                  r = send_request(req_counter + idx, label="SPIKE")
                  with lock:
                      spike_results[idx] = r

              threads = [
                  threading.Thread(target=spike_worker, args=(i,))
                  for i in range(spike_requests)
              ]
              for t in threads:
                  t.start()
              for t in threads:
                  t.join()

              all_results.extend(spike_results)
              req_counter += spike_requests

              # Phase 3: Baseline after spike (sequential)
              print(f"\n📋 Phase 3: Baseline (after spike) — checking recovery")
              for i in range(baseline_requests):
                  result = send_request(req_counter, label="BASELINE_AFTER")
                  all_results.append(result)
                  req_counter += 1

          # ─────────────────────────────────────────
          # Build final report
          # ─────────────────────────────────────────
          successful   = [r for r in all_results if r["success"]]
          failed       = [r for r in all_results if not r["success"]]
          valid_times  = [r["response_time_ms"] for r in all_results if r["response_time_ms"] is not None]
          stats        = calc_stats(valid_times)

          # Create simplified requests array for frontend
          requests_for_frontend = []
          for r in all_results:
              requests_for_frontend.append({
                  "request_num": r["request_num"],
                  "status": r["status"],
                  "status_code": r["status_code"],
                  "response_time_ms": r["response_time_ms"],
                  "response_size": r["response_size"]
              })

          report = {
              "test_type":        test_type,
              "iflow_url":        url,
              "http_method":      method,
              "timestamp":        datetime.utcnow().isoformat() + "Z",
              "total_requests":   len(all_results),
              "successful":       len(successful),
              "failed":           len(failed),
              "error_rate_pct":   round((len(failed) / len(all_results)) * 100, 1) if all_results else 0,
              **stats,
              "requests":         requests_for_frontend,
              "results":          all_results  # Keep detailed results for debugging
          }

          # Add spike-specific breakdown
          if test_type == "spike":
              baseline_before = [r for r in all_results if r["label"] == "BASELINE_BEFORE"]
              spike_phase     = [r for r in all_results if r["label"] == "SPIKE"]
              baseline_after  = [r for r in all_results if r["label"] == "BASELINE_AFTER"]

              bb_times = [r["response_time_ms"] for r in baseline_before if r["response_time_ms"]]
              sp_times = [r["response_time_ms"] for r in spike_phase     if r["response_time_ms"]]
              ba_times = [r["response_time_ms"] for r in baseline_after  if r["response_time_ms"]]

              report["spike_breakdown"] = {
                  "baseline_before": {**calc_stats(bb_times), "count": len(baseline_before),
                                      "failed": len([r for r in baseline_before if not r["success"]])},
                  "spike_phase":     {**calc_stats(sp_times), "count": len(spike_phase),
                                      "failed": len([r for r in spike_phase if not r["success"]])},
                  "baseline_after":  {**calc_stats(ba_times), "count": len(baseline_after),
                                      "failed": len([r for r in baseline_after if not r["success"]])}
              }

          # Save report
          Path("results/performance_report.json").write_text(
              json.dumps(report, indent=2)
          )

          print(f"\n{'='*50}")
          print(f"📊 PERFORMANCE TEST COMPLETE")
          print(f"{'='*50}")
          print(f"Total Requests : {report['total_requests']}")
          print(f"Successful     : {report['successful']}")
          print(f"Failed         : {report['failed']}")
          print(f"Error Rate     : {report['error_rate_pct']}%")
          if stats:
              print(f"Min Response   : {stats['min_ms']}ms")
              print(f"Max Response   : {stats['max_ms']}ms")
              print(f"Avg Response   : {stats['avg_ms']}ms")
              print(f"P95 Response   : {stats['p95_ms']}ms")
          print(f"{'='*50}")
          PYEOF

      - name: Commit performance report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/performance_report.json
          git commit -m "Performance Test Report - ${{ github.event.inputs.test_type }} on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      - name: Upload Performance Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Performance_Test_Report
          path: results/performance_report.json
          retention-days: 7
